<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slideshow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slideshow">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity var(--fade, 1s) ease;
  }
  .slide.show { opacity: 1; }
  body.cover .slide { object-fit: cover; }
  body.kenburns .slide.show { animation: kb var(--dur, 6s) linear forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }

  .ui { position: fixed; left: 0; right: 0; transition: opacity 0.3s; z-index: 2; }
  body.hide-ui .ui { opacity: 0; pointer-events: none; }
  .bar-top {
    top: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 28px;
    background: linear-gradient(rgba(0,0,0,0.6), transparent);
    display: flex; justify-content: space-between; align-items: baseline; font-size: 15px;
  }
  .bar-bot {
    bottom: 0; padding: 32px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
  }
  #caption { font-size: 17px; text-align: center; min-height: 22px; margin-bottom: 12px; text-shadow: 0 1px 3px #000; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls select {
    font: inherit; font-size: 15px; color: #fff; background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 22px; height: 44px; min-width: 44px; padding: 0 8px;
    -webkit-appearance: none; appearance: none;
  }
  .controls button.on { background: rgba(255,255,255,0.85); color: #000; }
  .controls button:active { opacity: 0.6; }
  #playBtn { min-width: 56px; font-size: 18px; }
  #speed { text-align: center; text-align-last: center; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #aaa; font-size: 16px; line-height: 1.5; }
</style>
</head>
<body class="kenburns">
  <div id="stage">
    <img class="slide" id="imgA" alt="">
    <img class="slide" id="imgB" alt="">
  </div>

  <div class="ui bar-top">
    <span id="counter"></span>
    <span id="status"></span>
  </div>

  <div class="ui bar-bot">
    <div id="caption"></div>
    <div class="controls">
      <button id="prevBtn" aria-label="Previous">‹</button>
      <button id="playBtn" aria-label="Play or pause">▶︎</button>
      <button id="nextBtn" aria-label="Next">›</button>
      <select id="speed" aria-label="Seconds per photo">
        <option value="3">3s</option><option value="5">5s</option><option value="8">8s</option>
        <option value="15">15s</option><option value="30">30s</option><option value="60">60s</option>
      </select>
      <button id="shuffleBtn" aria-label="Shuffle">⇄</button>
      <button id="fitBtn" aria-label="Fill screen">⤢</button>
      <button id="kbBtn" aria-label="Slow zoom">⊕</button>
    </div>
  </div>

  <div class="msg" id="msg">Loading photos…</div>

<script>
'use strict';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const $ = id => document.getElementById(id);

const prefs = Object.assign({ seconds: 5, shuffle: false, cover: false, kenburns: true }, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', prefs);

let photos = [];     // [{src, caption}]
let order = [];      // indices into photos (shuffled or not)
let pos = 0;         // position in order
let playing = false, timer = null, front = $('imgA'), back = $('imgB');
let wakeLock = null, uiTimer = null;

/* ---------- Load the photo list ---------- */
function captionFrom(src) {
  return decodeURIComponent(src.split('/').pop().replace(/\.[^.]+$/, '')).replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadList() {
  const r = await fetch('photos.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('Could not load photos.json (' + r.status + ')');
  const list = await r.json();
  return list.map(p => typeof p === 'string' ? { src: p } : p)
             .filter(p => p && p.src)
             .map(p => ({ src: p.src, caption: p.caption !== undefined ? p.caption : captionFrom(p.src) }));
}

function buildOrder(keepCurrent) {
  const cur = order[pos];
  order = photos.map((_, i) => i);
  if (prefs.shuffle) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }
  pos = keepCurrent && cur !== undefined ? Math.max(0, order.indexOf(cur)) : 0;
}

/* ---------- Showing slides ---------- */
const preloadCache = new Map();
function preload(idx) {
  const src = photos[order[idx]]?.src;
  if (!src || preloadCache.has(src)) return;
  const im = new Image(); im.decoding = 'async'; im.src = src;
  preloadCache.set(src, im);
  if (preloadCache.size > 6) preloadCache.delete(preloadCache.keys().next().value);
}

function show(newPos, instant) {
  const n = order.length;
  pos = ((newPos % n) + n) % n;
  const p = photos[order[pos]];
  const target = back;
  target.onload = () => {
    if (instant) { front.style.transition = target.style.transition = 'none'; }
    // restart Ken Burns animation on the incoming image
    target.style.animation = 'none'; void target.offsetWidth; target.style.animation = '';
    target.classList.add('show');
    front.classList.remove('show');
    [front, back] = [target, front];
    if (instant) requestAnimationFrame(() => { front.style.transition = back.style.transition = ''; });
  };
  target.onerror = () => { $('status').textContent = 'Missing: ' + p.src; };
  target.src = p.src;
  target.alt = p.caption || '';
  $('caption').textContent = p.caption || '';
  $('counter').textContent = (pos + 1) + ' / ' + n;
  preload(pos + 1); preload(pos - 1);
  if (playing) schedule();
}
const next = () => show(pos + 1);
const prev = () => show(pos - 1);

/* ---------- Playback ---------- */
function schedule() { clearTimeout(timer); timer = setTimeout(next, prefs.seconds * 1000); }

async function setPlaying(on) {
  playing = on;
  $('playBtn').textContent = on ? '❚❚' : '▶︎';
  $('status').textContent = on ? '' : 'Paused';
  if (on) { schedule(); requestWake(); hideUiSoon(); }
  else { clearTimeout(timer); releaseWake(); showUi(); }
}

// Keep the screen on while playing (supported in iOS 16.4+)
async function requestWake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch { /* not fatal: screen may dim */ }
}
function releaseWake() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing) requestWake(); });

function applyPrefs() {
  document.body.classList.toggle('cover', prefs.cover);
  document.body.classList.toggle('kenburns', prefs.kenburns);
  document.body.style.setProperty('--dur', (prefs.seconds + 1) + 's');
  document.body.style.setProperty('--fade', Math.min(1, prefs.seconds / 4) + 's');
  $('speed').value = String(prefs.seconds);
  $('shuffleBtn').classList.toggle('on', prefs.shuffle);
  $('fitBtn').classList.toggle('on', prefs.cover);
  $('kbBtn').classList.toggle('on', prefs.kenburns);
}

/* ---------- Controls UI ---------- */
function showUi() { document.body.classList.remove('hide-ui'); hideUiSoon(); }
function hideUiSoon() { clearTimeout(uiTimer); if (playing) uiTimer = setTimeout(() => document.body.classList.add('hide-ui'), 3000); }
function toggleUi() { document.body.classList.contains('hide-ui') ? showUi() : (document.body.classList.add('hide-ui'), clearTimeout(uiTimer)); }

$('playBtn').onclick = () => setPlaying(!playing);
$('nextBtn').onclick = () => { next(); showUi(); };
$('prevBtn').onclick = () => { prev(); showUi(); };
$('speed').onchange = e => { prefs.seconds = +e.target.value; savePrefs(); applyPrefs(); if (playing) schedule(); showUi(); };
$('shuffleBtn').onclick = () => { prefs.shuffle = !prefs.shuffle; savePrefs(); applyPrefs(); buildOrder(true); show(pos, true); showUi(); };
$('fitBtn').onclick = () => { prefs.cover = !prefs.cover; savePrefs(); applyPrefs(); showUi(); };
$('kbBtn').onclick = () => { prefs.kenburns = !prefs.kenburns; savePrefs(); applyPrefs(); showUi(); };
document.querySelectorAll('.ui').forEach(el => el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true }));

/* ---------- Gestures: swipe to change, tap to show/hide controls ---------- */
let sx = 0, sy = 0, st = 0;
$('stage').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
$('stage').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - st < 400) { toggleUi(); }
});
$('stage').addEventListener('click', e => { if (!('ontouchstart' in window)) toggleUi(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
});

/* ---------- Start ---------- */
(async () => {
  applyPrefs();
  try {
    photos = await loadList();
    if (!photos.length) throw new Error('photos.json is empty. Add some photos to the photos folder.');
    $('msg').remove();
    buildOrder(false);
    show(0, true);
    setPlaying(true);
  } catch (e) {
    $('msg').textContent = e.message;
  }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
